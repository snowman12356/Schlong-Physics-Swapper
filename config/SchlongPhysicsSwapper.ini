; ===========================================================================
;  SCHLONG PHYSICS SWAPPER - SETTINGS
; ===========================================================================
;
;  Most people never need to open this file. Everything below is also
;  available in the in-game menu (Help > Open settings file / Reload settings).
;
;  The menu does not show every value here. That is deliberate: the menu only
;  carries the choices people actually change. This file has the rest, with
;  working defaults already set.
;
;  HOW TO EDIT
;  1. Change a value after the  =  sign. Leave everything else alone.
;  2. Save the file.
;  3. In game: Help page > Reload settings. No restart needed.
;
;  Values are clamped to a safe range on load. A number that is too large or
;  too small is pulled back to the nearest allowed value rather than ignored,
;  and a comment like "; 0-20" tells you the range. Anything after a
;  semicolon is a comment and is ignored.
;
; ===========================================================================


; ===========================================================================
;  MIGRATION - leave this alone
; ===========================================================================
;  This packaged file imports an existing 1.2.x settings file once, then the
;  marker is removed automatically. Nothing here affects gameplay.
[Migration]
PreferLegacyIfPresent=true


; ===========================================================================
;  GENERAL - the everyday behaviour
; ===========================================================================
[General]

; Turn the whole mod on or off. false = SPS does nothing at all.
Enabled=true

; Arousal at which the player becomes erect (0-100).
; Your arousal mod (OSL Aroused, SLO, or SexLab Aroused) supplies this value.
ArousalThreshold=60.0

; How far arousal must fall BELOW ArousalThreshold before going soft again
; (0-25). Prevents flickering when arousal sits right on the threshold.
; With the defaults this means erect at 60, soft again at 55 or below.
Hysteresis=5.0

; 0 = follow arousal (the normal choice)
; 1 = always soft, using SMP
; 2 = always erect, using CBPC
; Modes 1 and 2 ignore arousal completely and need no arousal mod.
Mode=0

; How far the erect position points up (0-20).
; 0 points straight out, 20 is the highest position this skeleton offers.
ErectBend=14

; How often SPS re-checks arousal and scenes, in milliseconds (250-10000).
; Only lower this if you want a faster reaction and can afford the cost.
PollMilliseconds=1000


; ===========================================================================
;  POSITION - the angles and how SPS moves between them
; ===========================================================================
[Position]

; Let SPS control the angle. Turn this off only if another mod should own it
; (for example a mod that provides its own penetration adjustment).
Enabled=true

; The soft angle cannot be set with Method=1 unless Schlongs of Skyrim AE is
; loaded. Leave this false to keep the skeleton's normal hanging pose instead.
; If true, FlaccidBend (0-20) sets the resting angle; 0 is the normal pose.
FlaccidAngleControl=false
FlaccidBend=0

; How SPS drives the angle:
;   0 = SOS AE direct control (legacy; SOS AE 4.0.0 removed it, so it falls
;       back to animation events)
;   1 = SOS / TNG animation stages
;   2 = choose automatically (recommended)
;   3 = SPS pose angle (experimental, does not work with SOS/TNG or CBPC
;       because the animation graph overwrites the bone every frame)
Method=2

; Experimental pose-angle tilt in degrees (0-90). Only used with Method=3.
PoseAngleDegrees=45.0

; Ease between angle stages instead of snapping. Leave true.
AnimateChanges=true

; Use a timed rise instead of jumping straight to the erect angle. Leave true.
GradualErection=true

; How long a full soft -> erect transition takes, in milliseconds (500-30000).
; The animation graph has 19 stages (18 steps), so 8000 means roughly 0.45 s
; per step. Larger values look smoother; 30000 is the maximum.
ErectionDurationMilliseconds=8000

; How long a full erect -> soft transition takes, in milliseconds (500-30000).
; Usually a little slower than the rise looks more natural.
SofteningDurationMilliseconds=8000

; Ignore angle changes that arrive too quickly after the last one. Stops
; repeated bouncing when arousal hovers near the threshold. Leave true.
BounceGuard=true

; Use a different erect angle during SexLab/OStim scenes (0-20 in SexLabBend).
UseSeparateSexLabBend=false
SexLabBend=14

; Milliseconds to wait for the mesh to settle before setting an angle
; (0-5000). Only raise this if angles land before the body is ready.
SettleDelayMilliseconds=350

; How many angle attempts may fail before automatic repair pauses (1-10).
; Raise it only if you are diagnosing a repeated failure.
MaxAutomaticFailures=3


; ===========================================================================
;  NPCs - nearby NPC poses (experimental)
; ===========================================================================
[NPCs]

; Pose up to eight nearby NPCs from their arousal.
; IMPORTANT: turn off OSL Aroused's own "Enable SOS" option first, otherwise
; the two mods fight over the same NPCs. SPS will not change that for you.
BasicSOSEnabled=false

; Your confirmation that you turned that option off. SPS refuses to run basic
; NPC behaviour until this is true.
ProviderSOSDisabledConfirmed=false

; Give one NPC full SPS physics control (its own arousal and SMP/CBPC). This
; is separate from the basic behaviour above; an enrolled NPC leaves the basic
; list so the two never issue competing commands.
ManagedNPCEnabled=false

; Managed NPCs are limited to one. Setting this to true raises the limit to
; eight. Every managed NPC runs its own SMP/CBPC handoffs and Papyrus polls, so
; expect a performance cost with several. Existing NPCs are kept if you lower it
; again; remove the extras yourself.
ManagedNPCUpToEight=false


; ===========================================================================
;  COMPATIBILITY - scene frameworks
; ===========================================================================
[Compatibility]

; Manage soft/erect state during SexLab P+ scenes. Nothing here affects
; normal gameplay.
SexLabPPlusOverride=true

; Follow the player's role: receiving/bottom keeps the state from scene entry,
; penetrating/top uses erect physics.
SexLabRoleSwitching=true

; What the bottom does during a scene:
;   0 = keep the state from scene entry (recommended)
;   1 = follow live arousal
;   2 = always soft (SMP)
;   3 = always erect (CBPC)
SexLabBottomBehavior=0

; If the scene cannot be classified, use:
;   0 = keep the current owner (recommended)
;   1 = soft (SMP)
;   2 = erect (CBPC)
SexLabUnknownRole=0

; Milliseconds to wait after a scene ends before returning to normal (0-10000).
SexLabEndDelayMilliseconds=1500

; Experimental OStim Standalone support. The optional FOMOD bridge is required.
OStimOverride=true
OStimRoleSwitching=true


; ===========================================================================
;  RELIABILITY - automatic repair
; ===========================================================================
[Reliability]

; Milliseconds that must pass between physics changes (0-5000). Raise this if
; switches happen back to back.
SwitchCooldownMilliseconds=750

; Run one full player-only SMP reset after loading, then restore the correct
; state. Recommended; fixes a common "physics is dead after load" problem.
ResetSMPAfterLoad=true

; How long to wait before that reset, in milliseconds (1000-60000). Needs to
; be late enough that the body is fully loaded.
SMPResetDelayMilliseconds=10000

; Restore physics and angle after the player's armour or schlong mesh changes.
; Recommended.
RepairAfterEquipmentChange=true


; ===========================================================================
;  NATURAL BEHAVIOUR - optional, all off by default
; ===========================================================================
[NaturalBehaviour]

; Start using erect physics at ErectionStartArousal (0-99), then raise the
; angle with arousal until ArousalThreshold. This makes the angle follow the
; arousal value instead of waiting for a threshold crossing.
ArousalBasedErection=false
ErectionStartArousal=20.0

; Random erections. A new interval is chosen between the minimum and maximum
; each time (minutes), and each lasts RandomDurationSeconds (5-600).
RandomErections=false
RandomMinimumMinutes=15
RandomMaximumMinutes=45
RandomDurationSeconds=60

; Only start when it will not interrupt you: waits during combat, dialogue,
; loading screens, paused menus and similar moments.
RandomSafeMomentsOnly=true

; Prevent spontaneous erections from happening back to back (minutes, 1-60).
SpontaneousRefractory=true
RefractoryMinutes=5

; May trigger after the player sleeps or waits at least three in-game hours.
MorningErections=false
MorningDurationSeconds=90


; ===========================================================================
;  DEBUG
; ===========================================================================
[Debug]

; Writes a much more detailed SPS log (SchlongPhysicsSwapper.log). Turn on temporarily when
; collecting a log for a bug report, then turn it back off.
VerboseLogging=false
