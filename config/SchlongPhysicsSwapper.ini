[Migration]
; The packaged default imports an existing 1.2.x INI once, then this marker is removed.
PreferLegacyIfPresent=true

[General]
; Settings are shared across saves.
Enabled=true
ArousalThreshold=60.0
Hysteresis=5.0
Mode=0
ErectBend=14
PollMilliseconds=1000

[Compatibility]
SexLabPPlusOverride=true
; During P+ scenes receiving/bottom keeps the state from scene entry; penetrating/top uses CBPC.
SexLabRoleSwitching=true
; 0 keeps the scene-entry state. 1 follows live arousal. 2=SMP, 3=CBPC.
SexLabBottomBehavior=0
; 0 keeps the current owner if P+ cannot classify a stage. 1=SMP, 2=CBPC.
SexLabUnknownRole=0
SexLabEndDelayMilliseconds=1500
; Experimental OStim Standalone scene support. The optional FOMOD bridge is required.
OStimOverride=true
OStimRoleSwitching=true

[Reliability]
SwitchCooldownMilliseconds=750
; Runs one full player-only FSMP reset after loading, then restores the SPS state.
ResetSMPAfterLoad=true
SMPResetDelayMilliseconds=10000
; Quietly restores physics and angle after armour or schlong mesh changes.
RepairAfterEquipmentChange=true

[Position]
Enabled=true
; Optional SOS AE-NG only setting. Leave off to use the normal floppy resting pose.
FlaccidAngleControl=false
FlaccidBend=0
Method=2
AnimateChanges=true
GradualErection=true
ErectionDurationMilliseconds=3000
; Softening is intentionally a little slower than rising by default.
SofteningDurationMilliseconds=5000
BounceGuard=true
UseSeparateSexLabBend=false
SexLabBend=14
SettleDelayMilliseconds=350
MaxAutomaticFailures=3

[NaturalBehaviour]
; Optional. Starts using CBPC at ErectionStartArousal, then raises the angle with arousal until ArousalThreshold.
ArousalBasedErection=false
ErectionStartArousal=20.0
; Optional and off by default. A new interval is chosen between the minimum and maximum each time.
RandomErections=false
RandomMinimumMinutes=15
RandomMaximumMinutes=45
RandomDurationSeconds=60
; Wait during combat, dialogue, loading, paused menus and other unsuitable moments.
RandomSafeMomentsOnly=true
; Prevent spontaneous erections from immediately repeating.
SpontaneousRefractory=true
RefractoryMinutes=5
; Optional. May trigger after the player sleeps or waits for at least three in-game hours.
MorningErections=false
MorningDurationSeconds=90

[Debug]
; Leave this off normally. Turn it on temporarily when collecting a detailed log.
VerboseLogging=false
