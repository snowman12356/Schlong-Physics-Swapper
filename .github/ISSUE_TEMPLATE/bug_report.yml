name: Bug report
description: Report a Schlong Physics Swapper problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the mod. Open Help and reports and check your setup first. For repeatable problems, record the next 30 seconds and attach the resulting text file below.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: 1.7.2
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Skyrim runtime and SKSE version
      description: These are included in the report created from Help and reports.
      placeholder: Skyrim 1.6.1170, SKSE 2.2.6
    validations:
      required: true
  - type: input
    id: addon
    attributes:
      label: Schlong addon and body setup
      placeholder: UBE SOS addon, UBE body
    validations:
      required: true
  - type: dropdown
    id: manager
    attributes:
      label: Mod manager
      options:
        - Mod Organizer 2
        - Vortex
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that makes the problem happen.
      placeholder: |
        1. Load a save
        2. Raise OSL arousal above the threshold
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: SPS report
      description: Drag the generated .txt file here. Check it yourself before uploading.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Relevant conflicts or overrides
      description: Mention anything overwriting the SPS INI, CBPC configs or OSL compatibility script. Say whether Physics Editor or Auto Physics Reset is installed.
  - type: textarea
    id: crash-log
    attributes:
      label: Crash log (only if Skyrim crashed)
      description: Attach the newest Crash Logger file from the same play session. Leave this blank for non-crash bugs.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I used Check my setup again in Help and reports.
          required: true
        - label: I checked that this report does not contain information I do not want to share.
          required: true
